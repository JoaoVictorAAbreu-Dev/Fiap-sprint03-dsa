[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motiva-sprint3-pipeline"
version = "0.1.0"
description = "Pipeline real e rastreavel para indicadores de vegetacao em rodovias"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
runtime = [
    "numpy>=1.26,<3",
    "rasterio>=1.3,<2",
]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
motiva-sprint3 = "motiva_sprint3.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
